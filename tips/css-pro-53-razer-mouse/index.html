<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razer Setup CSS Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mouse-pad" id="pad">
        <div class="underglow"></div>
        
        <div class="razer-mouse" id="mouse">
            <div class="click-zone click-left" id="click-left"></div>
            <div class="click-zone click-right" id="click-right"></div>
            <div class="middle-slit"></div>
            <div class="scroll-wheel" id="scroll-wheel"></div>
            
            <div class="razer-logo" id="logo"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
